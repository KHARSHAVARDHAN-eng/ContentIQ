version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: documentiq-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documentiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: documentiq-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DocumentIQ
      - SECRET_KEY=supersecretjwtkeychangeinproduction123456789
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=documentiq
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - db
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: documentiq-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build: ./frontend
    container_name: documentiq-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:

