services:
  # 1. Qdrant Vector Database (Self-hosted Fallback - Optional if using Qdrant Cloud)
  - type: pserv
    name: documentiq-qdrant
    runtime: image
    image: qdrant/qdrant:latest
    disk:
      name: qdrant-storage
      mountPath: /qdrant/storage
      sizeGB: 10
    routes:
      - path: /
        port: 6333

  # 2. FastAPI Python Backend
  - type: web
    name: documentiq-backend
    env: docker
    dockerfile: Dockerfile
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documentiq-db
          property: connectionString
      - key: QDRANT_HOST
        fromService:
          name: documentiq-qdrant
          value: host
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User will input their key in Render UI
      - key: GEMINI_MODEL
        value: gemini-1.5-flash # Corrected to standard model name
      - key: STORAGE_TYPE
        value: local
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION_NAME
        value: us-east-1
      - key: ALLOWED_ORIGINS
        sync: false

  # 3. React Frontend (Static Site - Fallback/Alternative to Vercel)
  - type: web
    name: documentiq-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: documentiq-backend
          property: url

databases:
  # 4. PostgreSQL Database Instance
  - name: documentiq-db
    databaseName: documentiq
    user: postgres
    plan: free

